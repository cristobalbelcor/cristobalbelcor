# Genera mis estadísticas y la culebrita que se come el gráfico de contribuciones.
# Corre cada día y publica los SVG en la rama "output", que es la que lee el README.
name: Estadísticas y culebrita

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Estadísticas
        run: node .github/scripts/stats.mjs ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-claro.svg?color_snake=#1a7f37&color_dots=#ebedf0,#aceebb,#4ac26b,#2da44e,#116329
            dist/snake-oscuro.svg?color_snake=#3fb950&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
